# Vérifie la signature de security.txt à chaque PR et publie site/ sur GitHub Pages depuis main. Aucun secret.
name: site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controle:
    name: controle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vérifier la signature et l'empreinte
        run: |
          attendu=A782AC57321A862C2ED8F0FB34F15332E2A07A30
          [ "$(gpg --show-keys --with-colons site/security.asc | awk -F: '/^fpr/{print $10; exit}')" = "$attendu" ]
          gpg --import site/security.asc
          gpg --verify site/.well-known/security.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # `.well-known` : l'action écarte par défaut ce qui commence par un point.
          include-hidden-files: true

  publication:
    name: publication
    if: github.event_name != 'pull_request'
    needs: controle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
