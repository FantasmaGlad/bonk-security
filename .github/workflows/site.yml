name: site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controle:
    name: controle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vérifier la signature et l'empreinte
        run: |
          attendu=A782AC57321A862C2ED8F0FB34F15332E2A07A30
          [ "$(gpg --show-keys --with-colons web/public/security.asc | awk -F: '/^fpr/{print $10; exit}')" = "$attendu" ]
          gpg --import web/public/security.asc
          gpg --verify web/public/.well-known/security.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: corepack enable
      - name: Site
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
          # `.well-known`: the action skips dot paths by default.
          include-hidden-files: true

  publication:
    name: publication
    if: github.event_name != 'pull_request'
    needs: controle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  menage:
    name: menage
    needs: publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Garder les trois derniers déploiements
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/deployments?environment=github-pages&per_page=100" --jq '.[].id' \
            | tail -n +4 \
            | while read -r id; do
                gh api -X POST "repos/$GH_REPO/deployments/$id/statuses" -f state=inactive > /dev/null
                gh api -X DELETE "repos/$GH_REPO/deployments/$id"
              done
